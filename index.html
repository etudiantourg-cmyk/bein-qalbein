<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#500820">
<meta name="description" content="بين قلبين برو — رسائل مودة واهتمام">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>BEIN QALBEIN PRO</title>
<style>
:root{--wine:#4c0825;--wine2:#8f1242;--wine3:#b51e52;--gold:#f0c66e;--gold2:#ffe8ad;--cream:#fff5e9;--paper:#fffaf4;--ink:#48152b;--muted:#8d6573;--shadow:0 14px 32px #43051f24}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;color:var(--ink);font-family:system-ui,-apple-system,"Noto Naskh Arabic","Segoe UI",sans-serif;background:radial-gradient(ellipse at 50% 0,#fff9f4 0,#f7dfe4 48%,#e8c2ce 100%);min-height:100vh}
button,select,input{font:inherit}button{cursor:pointer}
header{position:relative;overflow:hidden;text-align:center;color:#fff4d9;padding:26px 16px 28px;border-bottom:3px solid var(--gold);border-radius:0 0 38px 38px;background:radial-gradient(ellipse at 50% 10%,#a82a58 0,#650d32 50%,#310416 100%);box-shadow:0 12px 30px #4b082c55,inset 0 -3px 0 #e9bd68}
header:before,header:after{content:"";position:absolute;border:1px solid #f8d98d;border-radius:50%;opacity:.28;pointer-events:none}
header:before{width:250px;height:250px;top:-175px;left:-75px}header:after{width:210px;height:210px;bottom:-165px;right:-55px}
.brandmark{display:flex;justify-content:center;margin-bottom:10px}.brandmark img{width:86px;height:86px;border-radius:22px;box-shadow:0 7px 20px #16000b66;border:2px solid #f5d58d}
.logo{font-size:clamp(25px,6vw,36px);font-weight:950;letter-spacing:.5px;text-shadow:0 3px 10px #18000b}
.arabic-brand{font-size:clamp(30px,8vw,43px);font-weight:900;color:var(--gold2);text-shadow:0 3px 0 #6c2d12,0 7px 15px #17000b;margin-top:2px}
.sub{color:#ffe7b4;margin-top:7px;font-size:15px}
main{max-width:780px;margin:auto;padding:15px 13px 30px}
.panel{position:relative;background:linear-gradient(145deg,#fffdf9,#ffeadf);border:1.5px solid #dfbd79;border-radius:25px;padding:19px 16px;margin:15px 0;box-shadow:var(--shadow),inset 0 1px 0 #fff}
h2{font-size:20px;color:#5a0c2d;margin:0 0 15px;font-weight:900}
.roles{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.role{min-height:76px;border-radius:22px;border:1.5px solid #e4bac6;background:linear-gradient(145deg,#fff4f5,#f4dce4);color:#64112f;font-weight:850;font-size:18px;box-shadow:0 5px 12px #5b102014}
.role .ico{display:block;font-size:25px;margin-bottom:3px}
.role.active{background:linear-gradient(145deg,#163c68,#071b39);border:2px solid var(--gold);color:#fff0c5;box-shadow:0 5px 15px #081a3b55}
.role.active.wife{background:linear-gradient(145deg,#ad174d,#4c0825)}
label{display:block;margin:14px 0 5px;font-weight:800;color:#5a0c2d}
select,input{width:100%;padding:13px 14px;border:1.5px solid #d8b66f;border-radius:16px;background:#fffdfb;color:var(--ink);outline:none}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.cat{display:flex;align-items:center;gap:10px;text-align:right;min-height:68px;padding:9px 11px;border-radius:19px;background:linear-gradient(145deg,#fff7f1,#f7e2df);border:1px solid #e6c2c9;color:#58112d;box-shadow:0 4px 9px #5b102010;font-weight:800}
.cat .badge{flex:0 0 43px;height:43px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,#d12c62,#520923);border:1px solid var(--gold);color:#ffe6a4;font-size:22px;box-shadow:0 3px 8px #4b092833}
.cat.active{background:linear-gradient(145deg,#86123d,#4b0825);color:#fff4d9;border:1.5px solid var(--gold)}
.cat small{display:block;font-size:11px;font-weight:500;opacity:.8;margin-top:2px}
.message-card{border:1.5px solid #dfbd79;border-radius:23px;padding:23px 17px;background:linear-gradient(145deg,#fffefa,#ffefe5);box-shadow:inset 0 1px 0 white;position:relative}
.message-card:before{content:"♡";position:absolute;top:-19px;left:calc(50% - 20px);width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,#a8154a,#4b0825);border:2px solid var(--gold);color:#ffe4a1;font-size:25px}
#message{font-size:19px;line-height:2.05;text-align:center;white-space:pre-wrap;min-height:110px;padding-top:8px}
.message-foot{text-align:center;color:#bd274d;font-size:23px;margin-top:5px}
.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.actions button,.row button,.wide{min-height:55px;border-radius:17px;border:1px solid #e5c18a;background:linear-gradient(145deg,#fff0dc,#f5dcb9);color:#5b0d2b;font-weight:850;box-shadow:0 4px 10px #5b102018}
.actions .primary,.primary,.wide.primary{background:linear-gradient(145deg,#a9144b,#500820);color:#fff0c5;border:1.5px solid var(--gold);box-shadow:0 5px 13px #570b2c44}
.row{display:flex;gap:9px;margin-top:10px}.row>*{flex:1}
.wide{width:100%;margin-top:10px}
.tools-title{display:flex;align-items:center;justify-content:space-between}
#favorites{margin-top:12px}.favitem{background:#fff8f2;border:1px solid #e7c987;border-radius:16px;margin-top:9px;padding:13px;line-height:1.8}
.favitem button{margin:7px 4px 0 0;padding:8px 12px;border-radius:12px;background:#f4e2e6;color:#5b0d2b}
.empty,.hint{text-align:center;color:var(--muted);font-size:13px}
footer{text-align:center;color:#805363;padding:22px 10px 32px;font-size:13px}
.spark{color:#d8a84f}
@media(min-width:560px){main{padding-inline:18px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.panel{padding:22px}}
@media(max-width:360px){.actions{grid-template-columns:1fr}.cat{font-size:13px}.cat .badge{flex-basis:37px;height:37px}}
</style>
</head>
<body>
<header>
 <div class="brandmark"><img src="icon.svg" alt="شعار بين قلبين"></div>
 <div class="arabic-brand">بين قلبين</div>
 <div class="logo">BEIN QALBEIN PRO</div>
 <div class="sub">الكلمات الجميلة تصنع حياة أجمل</div>
</header>
<main>
<section class="panel">
 <h2>اختر هويتك</h2>
 <div class="roles">
  <button class="role active" id="husband" data-role="husband"><span class="ico">♛</span>أنا زوج</button>
  <button class="role wife" id="wife" data-role="wife"><span class="ico">♡</span>أنا زوجة</button>
 </div>
 <label for="lang">لغة الواجهة</label>
 <select id="lang"><option value="ar">العربية</option><option value="en">English (واجهة أساسية)</option><option value="fr">Français (واجهة أساسية)</option></select>
</section>
<section class="panel">
 <h2>اختر التصنيف المناسب</h2>
 <input id="search" placeholder="ابحث عن تصنيف...">
 <div class="grid" id="cats" style="margin-top:12px"></div>
</section>
<section class="panel">
 <h2>رسالة من القلب</h2>
 <div class="message-card"><div id="message">اختر تصنيفاً لتظهر لك رسالة جميلة هنا.</div><div class="message-foot">♥</div></div>
 <div class="actions">
  <button id="shareBtn">↗ مشاركة</button>
  <button id="favBtn">☆ أضف للمفضلة</button>
  <button id="newBtn" class="primary">⟳ رسالة أخرى</button>
 </div>
 <button id="copyBtn" class="wide primary">▢ نسخ الرسالة</button>
</section>
<section class="panel">
 <div class="tools-title"><h2 style="margin:0">رسائلك المفضلة</h2><span class="spark">✦</span></div>
 <div class="row"><button id="showFav">عرض المفضلة</button><button id="hideFav">إخفاء المفضلة</button></div>
 <div id="favorites" class="hidden"></div>
</section>
<p class="hint">رسائل مودة واحترام ودعم، بكلمات راقية ومحتوى مناسب.</p>
</main>
<footer>صُنع بالمحبة والاحترام · BEIN QALBEIN PRO</footer>

const $=id=>document.getElementById(id);
let role='husband',lang='ar',selected='morning',current='',favs=[];
try{favs=JSON.parse(localStorage.getItem('bq_favorites')||'[]')}catch(e){favs=[]}
function saveFavs(){try{localStorage.setItem('bq_favorites',JSON.stringify(favs))}catch(e){alert('تعذر الحفظ في مساحة المتصفح.')}} 
function renderCats(filter=''){
 $('cats').innerHTML='';
 categories.filter(c=>c.name.includes(filter)).forEach(c=>{
  const b=document.createElement('button');b.className='cat'+(c.id===selected?' active':'');
  b.innerHTML=`<span class="badge">${c.icon}</span><span>${c.name}<small>${c.desc}</small></span>`;
  b.onclick=()=>{selected=c.id;renderCats($('search').value);generate()};
  $('cats').append(b);
 });
}
function generate(){
 const pool=messages[selected]||messages.morning;
 let next=pool[Math.floor(Math.random()*pool.length)];
 if(pool.length>1&&next===current)next=pool[(pool.indexOf(next)+1)%pool.length];
 current=next;
 if(role==='wife')current=current.replaceAll('حبيبي','حبيبتي');
 $('message').textContent=current;
}
function showFavs(){
 $('favorites').innerHTML='';
 if(!favs.length){$('favorites').innerHTML='<p class="empty">لم تحفظ رسائل بعد. أضف رسالة تعجبك لتجدها هنا.</p>';return}
 favs.forEach((item,i)=>{
  const box=document.createElement('div');box.className='favitem';
  const p=document.createElement('div');p.textContent=item;
  const copy=document.createElement('button');copy.textContent='نسخ';copy.onclick=()=>copyText(item);
  const del=document.createElement('button');del.textContent='حذف';del.onclick=()=>{favs.splice(i,1);saveFavs();showFavs()};
  box.append(p,copy,del);$('favorites').append(box);
 });
}
async function copyText(text){
 try{await navigator.clipboard.writeText(text);alert('تم النسخ بنجاح ✓')}
 catch(e){const t=document.createElement('textarea');t.value=text;document.body.append(t);t.select();document.execCommand('copy');t.remove();alert('تم النسخ ✓')}
}
document.querySelectorAll('.role').forEach(b=>b.onclick=()=>{role=b.dataset.role;document.querySelectorAll('.role').forEach(x=>x.classList.toggle('active',x===b));generate()});
$('newBtn').onclick=generate;
$('copyBtn').onclick=()=>current&&copyText(current);
$('shareBtn').onclick=async()=>{if(!current)return;if(navigator.share){try{await navigator.share({title:'BEIN QALBEIN PRO',text:current})}catch(e){}}else copyText(current)};
$('favBtn').onclick=()=>{
 if(!current)return;
 if(!favs.includes(current)){favs.unshift(current);saveFavs();$('favBtn').textContent='تمت الإضافة ✓';}
 else $('favBtn').textContent='محفوظة بالفعل ✓';
 $('favorites').classList.remove('hidden');showFavs();setTimeout(()=>$('favBtn').textContent='☆ أضف للمفضلة',1600);
};
$('showFav').onclick=()=>{$('favorites').classList.remove('hidden');showFavs()};
$('hideFav').onclick=()=>$('favorites').classList.add('hidden');
$('search').oninput=e=>renderCats(e.target.value);
$('lang').onchange=e=>{
 lang=e.target.value;
 document.documentElement.lang=lang;
 document.documentElement.dir=lang==='ar'?'rtl':'ltr';
 // Message library remains Arabic; changing this control currently changes layout direction only.
};
renderCats();generate();showFavs();
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js'));
</script>
</body></html>
